name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build

      - run: pnpm turbo test

      # Version and publish straight from main — no release PR. The PR flow
      # needs "Allow GitHub Actions to create and approve pull requests",
      # which this repo does not grant, so every run failed at that step.
      - name: Apply changesets
        id: version
        run: |
          if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changesets pending — nothing to release."
            exit 0
          fi
          pnpm version-packages
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./packages/react/package.json').version")" >> "$GITHUB_OUTPUT"
        env:
          # @changesets/changelog-github reads this to build changelog links.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Land the bump on main before publishing. The other order can leave a
      # version live on npm while main still carries the old one and the
      # consumed changesets — which no re-run can repair.
      - name: Commit the version bump
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages [skip ci]"
          # Another merge may have landed during install/build/test.
          git pull --rebase origin main
          git push origin HEAD:main

      # Unconditional on purpose: `changeset publish` only pushes versions the
      # registry does not have, so a run whose publish failed for an external
      # reason (an expired token, an npm outage) heals itself on the next push
      # instead of stranding a version that only main knows about.
      # Tags are created here, on the commit that carries the bump.
      # Two ways to be allowed to publish, and npm picks whichever is present:
      # an automation token in NPM_TOKEN, or trusted publishing, where the
      # registry trusts this workflow directly and npm mints a short-lived
      # OIDC token per run — nothing to store or rotate, and provenance is
      # attached automatically. Neither configured is the one real error, and
      # it is worth saying plainly: npm answers an unauthenticated publish
      # with a 404, which reads as "no such package".
      - name: Publish to npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] && [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No way to authenticate the publish. Either add an" \
                 "npm automation token as the NPM_TOKEN secret, or configure" \
                 "this workflow as a trusted publisher on npmjs.com."
            exit 1
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            # OIDC support landed in recent npm; the runner's bundled version
            # may predate it.
            echo "No NPM_TOKEN — publishing through trusted publishing (OIDC)."
            npm install -g npm@latest
          fi
          pnpm release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push tags
        run: git push origin --tags

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appshell-react@${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
