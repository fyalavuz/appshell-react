name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
      - run: pnpm turbo lint typecheck
      - run: pnpm turbo test
      - run: pnpm --filter @appshell-react/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
