version: 2
updates:
  # The workspace root holds every dependency (pnpm workspaces), so one entry
  # covers the library, the docs site and the tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      # One PR per family instead of a dozen — these move together anyway.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "jsdom", "@testing-library/*"]
      storybook:
        patterns: ["storybook", "@storybook/*"]
      dev-minor-and-patch:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Peer ranges are deliberately wide; bumping them is an API decision.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
